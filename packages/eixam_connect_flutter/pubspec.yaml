name: eixam_connect_flutter
description: Partner-facing Flutter SDK for integrating EIXAM SOS, device, telemetry, and diagnostics flows into host apps.
version: 0.3.0
homepage: https://docs.eixam.io/docs/flutter-sdk/overview
repository: https://github.com/eixam-tech/eixam-sdk-flutter
issue_tracker: https://github.com/eixam-tech/eixam-sdk-flutter/issues
publish_to: 'none'
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  eixam_connect_core:
    path: ../eixam_connect_core
  http: ^1.2.2
  crypto: ^3.0.7
  # Stay on 14.x: Dart API already uses LocationSettings. FGS location is SDK-owned.
  geolocator: ^14.0.3
  # Stay on 12.x: 13 needs compileSdk 37 (Flutter 3.44 is 36) and
  # permanentlyDenied via `status` is wrong — must use request().
  permission_handler: ^12.0.3
  # Stay on 22.x: 20+ named-arg APIs; 22 allows xml 7 used by the demo host.
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.3.2
  # Stay on 1.x: 2.x switches to a commercial FlutterBluePlus license
  # (15+ employees, build-time license ping). GATT stays on 1.36.8.
  flutter_blue_plus: ^1.36.8
  async: ^2.11.0
  # 5.0 only breaking change: MqttClient.updates is nullable after disconnect.
  mqtt5_client: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  xml: ^7.0.1
flutter:
  plugin:
    platforms:
      android:
        package: dev.eixam.connect.flutter
        pluginClass: EixamConnectFlutterPlugin
      ios:
        pluginClass: EixamConnectFlutterPlugin
